<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Pacemaker | Page Not Found</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: '#00263b',
              teal: '#00adbd',
              orange: '#ff4f02', // Brand orange token
              'orange-hover': '#e04400', // Brand orange hover token
              'gray-soft': '#f2f4f7', // Brand soft gray token
              body: '#475467' // Brand body text token
            },
            fontFamily: {
              heading: ['Poppins', 'sans-serif'],
              body: ['Source Sans 3', 'sans-serif']
            },
            boxShadow: {
              card: '0 10px 30px rgba(0,38,59,0.08)'
            }
          }
        }
      };
    </script>
    <style>
      /* Accessibility Focus styling */
      :focus-visible {
        outline: 2px solid #00adbd !important;
        outline-offset: 2px !important;
      }
      a {
        min-height: 44px;
        min-width: 44px;
      }
    </style>
  </head>
  <body class="min-h-screen bg-white font-body">
    <!--
      404 page. React: src/app/not-found.tsx (global) and
      src/app/courses/[id]/not-found.tsx (course copy), both via
      src/components/common/not-found-view.tsx.
      Header and footer come from the app layout, so they are left out here.
    -->
    <main
      class="flex min-h-[calc(100vh-135px)] w-full items-center justify-center bg-gray-soft px-6 py-16 md:py-24"
    >
      <div class="mx-auto flex max-w-[800px] flex-col items-center text-center">
        <p
          class="mb-6 font-heading text-[6rem] font-extrabold leading-none tracking-tight text-navy md:text-[9rem]"
        >
          404
        </p>
        <h1
          class="mb-3 font-heading text-[2rem] font-bold leading-[1.3] tracking-tight text-navy md:text-[2.75rem]"
        >
          Page not found
        </h1>
        <p
          class="mb-10 text-[1.125rem] leading-relaxed text-body md:text-[1.2rem]"
        >
          The link may be broken, or the page may have moved.
        </p>
        <a
          href="./main.html"
          class="inline-flex items-center gap-2 rounded-2xl bg-orange px-8 py-4 font-heading text-lg font-bold text-white shadow-[0_10px_25px_-5px_rgba(255,79,2,0.3)] transition-all hover:scale-[1.02] hover:bg-orange-hover"
        >
          Go to home
        </a>
      </div>
    </main>
  </body>
</html>
