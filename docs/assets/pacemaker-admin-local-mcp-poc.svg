<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#71849b"/></marker>
    <marker id="green-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#198754"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#20354d" flood-opacity=".09"/></filter>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172b44}.subtitle{font:18px Arial,sans-serif;fill:#62748a}
      .heading{font:700 21px Arial,sans-serif;fill:#1b2e45}.body{font:16px Arial,sans-serif;fill:#52657c}
      .small{font:14px Arial,sans-serif;fill:#62748a}.card{fill:#fff;stroke:#d9e3ee;stroke-width:2}
    </style>
  </defs>
  <rect width="1440" height="920" fill="#f5f8fc"/>
  <text x="64" y="68" class="title">Pacemaker 어드민 로컬 MCP POC</text>
  <text x="64" y="104" class="subtitle">Claude Desktop에서 강의 변경을 요청하고, Pacemaker가 권한 확인 후 저장합니다</text>

  <g filter="url(#shadow)">
    <rect x="64" y="150" width="260" height="150" rx="18" class="card"/>
    <rect x="368" y="150" width="290" height="150" rx="18" class="card"/>
    <rect x="702" y="150" width="300" height="150" rx="18" class="card"/>
    <rect x="1046" y="150" width="330" height="150" rx="18" class="card"/>
  </g>
  <text x="94" y="199" class="heading">관리자</text><text x="94" y="237" class="body">자연어로 요청</text><text x="94" y="269" class="small">변경안 검토 · 최종 승인</text>
  <text x="398" y="199" class="heading">Claude Desktop</text><text x="398" y="237" class="body">요청 해석 · 도구 호출</text><text x="398" y="269" class="small">관리자 개인용 앱</text>
  <text x="732" y="199" class="heading">Pacemaker 로컬 MCP</text><text x="732" y="237" class="body">관리자 컴퓨터에서 실행</text><text x="732" y="269" class="small">허용된 HTTPS API만 호출</text>
  <text x="1076" y="199" class="heading">Pacemaker 프로덕션</text><text x="1076" y="237" class="body">인증 · ADMIN 권한 확인</text><text x="1076" y="269" class="small">검증 · 감사 기록 · 저장</text>
  <path d="M324 225h34m300 0h34m310 0h34" fill="none" stroke="#71849b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="671" y="208" class="small">MCP</text><text x="1011" y="208" class="small">HTTPS</text>

  <text x="64" y="368" class="heading">강의 수정 흐름</text>
  <g>
    <rect x="64" y="398" width="410" height="76" rx="14" class="card"/>
    <rect x="64" y="492" width="410" height="76" rx="14" class="card"/>
    <rect x="64" y="586" width="410" height="76" rx="14" fill="#fff" stroke="#b8dfc8" stroke-width="2"/>
    <rect x="64" y="680" width="410" height="76" rx="14" fill="#edf8f2" stroke="#b8dfc8" stroke-width="2"/>
  </g>
  <g font-family="Arial,sans-serif" font-weight="700" font-size="15" text-anchor="middle" fill="#fff">
    <circle cx="104" cy="436" r="19" fill="#345dd4"/><text x="104" y="442">1</text>
    <circle cx="104" cy="530" r="19" fill="#345dd4"/><text x="104" y="536">2</text>
    <circle cx="104" cy="624" r="19" fill="#198754"/><text x="104" y="630">3</text>
    <circle cx="104" cy="718" r="19" fill="#198754"/><text x="104" y="724">4</text>
  </g>
  <text x="140" y="432" class="heading">강의 조회</text><text x="140" y="457" class="small">허용 필드만 가져오기</text>
  <text x="140" y="526" class="heading">변경안 제안</text><text x="140" y="551" class="small">Claude가 기존 값과 새 값을 보여줌</text>
  <text x="140" y="620" class="heading">관리자 승인</text><text x="140" y="645" class="small">Pacemaker 어드민 웹에서 확인</text>
  <text x="140" y="714" class="heading">적용 · 감사 기록</text><text x="140" y="739" class="small">서버 재검증 후 허용 필드 저장</text>
  <path d="M269 474v12m0 82v12m0 82v12" stroke="#71849b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="514" y="398" width="420" height="358" rx="18" fill="#fff7e8" stroke="#efd7a9" stroke-width="2"/>
  <text x="550" y="447" class="heading">보안 경계</text>
  <text x="550" y="498" class="body">• MCP는 DB에 직접 접속하지 않음</text>
  <text x="550" y="546" class="body">• 권한 판단은 Pacemaker 서버가 수행</text>
  <text x="550" y="594" class="body">• 대화의 “승인”만으로 저장하지 않음</text>
  <text x="550" y="642" class="body">• 토큰은 사용자별 발급 · 만료 · 폐기</text>
  <line x1="550" y1="674" x2="896" y2="674" stroke="#ead7b5"/>
  <text x="550" y="710" class="small">POC: 강의 텍스트만 수정</text>
  <text x="550" y="735" class="small">삭제 · 결제 · 회원정보 작업은 제외</text>

  <g filter="url(#shadow)">
    <rect x="974" y="398" width="402" height="150" rx="18" fill="#edf8f2" stroke="#b8dfc8" stroke-width="2"/>
    <rect x="974" y="600" width="402" height="156" rx="18" class="card"/>
  </g>
  <text x="1010" y="443" class="heading">권한 게이트</text><text x="1010" y="485" class="body">매 요청마다 사용자 · ADMIN 확인</text><text x="1010" y="518" class="small">실패하거나 만료되면 요청 거부</text>
  <path d="M1210 300v86m0 162v40" fill="none" stroke="#71849b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1010" y="651" class="heading">Prisma / PostgreSQL</text><text x="1010" y="692" class="body">허용된 강의 필드만 저장</text><text x="1010" y="725" class="small">기존 어드민 웹은 계속 동작</text>

  <text x="64" y="830" class="small">로컬 MCP는 연결 어댑터입니다. 최종 권한과 프로덕션 저장은 Pacemaker 서버가 통제합니다.</text>
  <text x="64" y="862" class="small">모델 API 사용료는 Claude 구독과 별도일 수 있습니다.</text>
</svg>
